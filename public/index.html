<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070908">
  <title>J.A.R.V.I.S. · Stark Industries</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="preload" href="/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <div id="boot" class="boot" hidden></div>

  <div class="app" id="app" data-view="console">
    <header class="top" id="top">
      <div class="brand">
        <svg class="mark" id="mark" viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor">
          <circle cx="16" cy="16" r="13.5" stroke-width="1.2"/>
          <circle class="seg" cx="16" cy="16" r="9.2" stroke-width="3" stroke-dasharray="4.3 1.8"/>
          <circle cx="16" cy="16" r="4.6" stroke-width="1.2"/>
          <circle cx="16" cy="16" r="1.8" fill="currentColor" stroke="none"/>
        </svg>
        <div>
          <div class="brand-name">J.A.R.V.I.S.</div>
          <div class="brand-sub">Stark Industries · <b>Doomsday</b> console</div>
        </div>
      </div>
      <div class="grow"></div>
      <span class="sim-wrap" id="simflag" hidden><span class="sim" title="No live accounts are connected. Calendar, Drive and Telegram are simulated.">SIMULATION</span></span>
      <div class="sysrow" id="sysrow"></div>
      <div class="clock" id="clock"><div class="t">--:--:--</div><div class="d"></div></div>
      <div class="status" id="status" role="status"><span class="dot"></span><span class="t">ONLINE</span></div>
    </header>

    <main class="main" id="main">
      <section class="panel console brackets" id="console" aria-label="Command console"></section>
      <div class="split" id="split" role="separator" aria-orientation="vertical" aria-label="Resize panels" tabindex="0"></div>
      <section class="panel preview brackets" id="preview" aria-label="Live preview"></section>
    </main>

    <nav class="mnav" id="mnav" aria-label="Switch view"></nav>
  </div>

  <div id="pop"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript><p style="padding:2rem;color:#ccc">JARVIS needs JavaScript.</p></noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
